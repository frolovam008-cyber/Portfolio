<svg width="240" height="240" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="44" fill="#0B1220"/>

  <defs>
    <linearGradient id="inf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .infinity {
      fill: none;
      stroke: url(#inf);
      stroke-width: 10;
      opacity: 0.16;
      filter: url(#glow);

      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawInf 2.6s ease forwards;
    }

    @keyframes drawInf {
      to { stroke-dashoffset: 0; }
    }

    .m, .f {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#shadow);

      stroke-dasharray: 500;
      stroke-dashoffset: 500;
    }

    .m {
      stroke: url(#g1);
      animation: drawM 1.2s ease forwards;
    }

    .f {
      stroke: url(#g2);
      transform: translate(10px, -6px);
      opacity: 0;

      animation:
        drawF 1.2s ease forwards,
        fadeF 0.6s ease forwards;

      animation-delay: 0.8s, 0.8s;
    }

    @keyframes drawM {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawF {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeF {
      0% {
        opacity: 0;
        transform: translate(18px, -12px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, -6px);
      }
    }
  </style>

  <!-- CENTERED INFINITY -->
  <path class="infinity"
        d="M20 100
           C20 55, 70 55, 100 100
           C130 145, 180 145, 180 100
           C180 55, 130 55, 100 100
           C70 145, 20 145, 20 100" />

  <!-- M -->
  <path class="m"
        d="M40 150V55
           L85 125
           L120 55
           L160 150" />

  <!-- F -->
  <path class="f"
        d="M105 150V55
           H170
           M105 105H160" />
</svg>
