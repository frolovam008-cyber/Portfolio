<svg width="240" height="240" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="44" fill="#0B1220"/>

  <defs>
    <linearGradient id="frame1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="frame2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .diamond1, .diamond2 {
      fill: none;
      stroke-width: 6;
      opacity: 0.18;
      filter: url(#glow);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .diamond1 {
      stroke: url(#frame1);
    }

    .diamond2 {
      stroke: url(#frame2);
    }

    .m, .f {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#shadow);

      stroke-dasharray: 500;
      stroke-dashoffset: 500;
    }

    .m {
      stroke: url(#g1);
      animation: drawM 1.2s ease forwards 0.3s;
    }

    .f {
      stroke: url(#g2);
      animation: drawF 1.2s ease forwards 0.9s;
    }

    @keyframes drawM {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawF {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- DIAMOND 1 -->
  <path class="diamond1"
        d="M100 20
           L175 100
           L100 180
           L25 100
           Z" />

  <!-- DIAMOND 2 (shifted for intersection) -->
  <path class="diamond2"
        d="M110 30
           L185 110
           L110 190
           L35 110
           Z" />

  <!-- MF CENTER -->
  <path class="m"
        d="M50 150V60
           L85 125
           L120 60
           L150 150" />

  <path class="f"
        d="M115 150V60
           H165
           M115 110H155" />
</svg>